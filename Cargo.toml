[package]
name = "zenshot"
version = "2.9.8"
edition = "2021"
authors = ["Masud Rana <masudranaxpert@gmail.com>"]
description = "Ultra-fast, featherlight cross-platform screen capture tool with zero disk I/O"
readme = "README.md"
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
xcap = "0.9"
arboard = { version = "3", features = ["wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
chrono = "0.4"
dirs = "5.0"
webbrowser = "1.0"

bytemuck = "1.25"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[package.metadata.deb]
name = "zenshot"
maintainer = "Masud Rana <masudranaxpert@gmail.com>"
copyright = "2026 ZenShot"
extended-description = """
ZenShot is an ultra-fast, featherlight screen capture utility.
Features pure in-memory zero-disk copy, region selection, rectangle, arrow, and pen annotations,
and on-demand file saving."""
section = "graphics"
priority = "optional"
depends = "libxkbcommon0, libwayland-client0, libegl1, libgl1, libx11-6"
assets = [
    ["target/release/zenshot", "usr/bin/", "755"],
    ["zenshot.desktop", "usr/share/applications/", "644"],
    ["assets/icon.svg", "usr/share/icons/hicolor/scalable/apps/zenshot.svg", "644"],
]
