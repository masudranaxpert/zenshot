name: Build and Release ZenShot

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ubuntu:
    name: Build Ubuntu (.deb & binary)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libpipewire-0.3-dev libspa-0.2-dev libclang-dev libegl1-mesa-dev libgl1-mesa-dev libgbm-dev libwayland-dev libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libasound2-dev

      - name: Build Release Binary
        run: cargo build --release

      - name: Build .deb package
        run: |
          chmod +x package_deb.sh
          ./package_deb.sh
          cp zenshot_*_amd64.deb zenshot-ubuntu-amd64.deb

      - name: Package Linux tar.gz
        run: |
          mkdir -p dist
          cp target/release/zenshot dist/
          cp README.md dist/
          tar -czvf zenshot-linux-x86_64.tar.gz -C dist .

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: zenshot-ubuntu-amd64
          path: |
            zenshot-ubuntu-amd64.deb
            zenshot-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          mkdir dist
          cp target/release/zenshot.exe dist/
          cp README.md dist/
          Compress-Archive -Path dist/* -DestinationPath zenshot-windows-x86_64.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: zenshot-windows-x86_64
          path: zenshot-windows-x86_64.zip

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release

      - name: Package macOS tar.gz
        run: |
          mkdir -p dist
          cp target/release/zenshot dist/
          cp README.md dist/
          tar -czvf zenshot-macos-x86_64.tar.gz -C dist .

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: zenshot-macos-x86_64
          path: zenshot-macos-x86_64.tar.gz

  release:
    name: Create GitHub Release
    needs: [build-ubuntu, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4.3.0

      - name: Publish Release with all binaries and .deb
        uses: softprops/action-gh-release@v2
        with:
          files: |
            zenshot-ubuntu-amd64/zenshot-ubuntu-amd64.deb
            zenshot-ubuntu-amd64/zenshot-linux-x86_64.tar.gz
            zenshot-windows-x86_64/zenshot-windows-x86_64.zip
            zenshot-macos-x86_64/zenshot-macos-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
